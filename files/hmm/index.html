<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Undertale browser game window">
  <title>UNDERTALE</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
  {
    "imports": {
      "@js-joda/core": "./runtime/starfait/vendor/js-joda.esm.js"
    }
  }
  </script>
</head>
<body>
  <main id="stage" aria-label="Undertale game window">
    <canvas id="game-canvas" width="640" height="480" tabindex="0" aria-label="Game screen"></canvas>

    <button id="debug-toggle" type="button" aria-label="Toggle debug log" aria-expanded="false" title="Debug (F1)">DBG</button>
    <section id="debug-panel" aria-label="Debug log" hidden>
      <div class="debug-title">WEBPORT DEBUG <span>F1</span></div>
      <pre id="debug-output">Starting webport…</pre>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
